# A HoldFast Sentinel (task 5.2). entrypoint.sh copies this into the
# Sentinel's volume on its first start and adds its announced name; the
# Sentinel then records in the copy what it learns (the current primary, the
# replicas, the other Sentinels).
bind * -::*
protected-mode no
port 26379
dir /data

# Members are known by fixed address (compose.yaml's `valkey` network), not
# by hostname: Sentinel resolves names inside its main loop, and a dead
# node's unresolvable name stalled it into TILT mode, where it refuses to
# fail over (P47). resolve-hostnames stays off (the default).

# The primary set "holdfast" (VALKEY_SENTINEL_MASTER), first the node
# "valkey". Two of the three Sentinels must agree it is down, and a majority
# must elect the Sentinel that runs the failover.
sentinel monitor holdfast 10.251.0.10 6379 2
# Down after 5 s without a valid reply: shorter risks a failover for a GC
# pause or a slow fsync; longer stretches every real outage.
sentinel down-after-milliseconds holdfast 5000
sentinel failover-timeout holdfast 60000
sentinel parallel-syncs holdfast 1
