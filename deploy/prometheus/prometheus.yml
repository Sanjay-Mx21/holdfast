global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: inventory
    static_configs:
      - targets: ["inventory:9090"]

  - job_name: queue
    static_configs:
      - targets: ["queue:9090"]

  - job_name: booking
    static_configs:
      - targets: ["booking:9090"]

  - job_name: payment
    static_configs:
      - targets: ["payment:9090"]
