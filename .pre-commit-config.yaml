# pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w -s
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: bash -c 'go vet ./... && go vet -tags=integration ./...'
        language: system
        pass_filenames: false
        types: [go]
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --new-from-rev=HEAD ./...
        language: system
        pass_filenames: false
        types: [go]
      - id: check-migrations
        name: migration files are well-formed and immutable
        entry: ./scripts/check-migrations.sh
        language: script
        pass_filenames: false
        files: ^db/migrations/
