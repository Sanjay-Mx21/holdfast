name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the migration check compares against origin/main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./... && go vet -tags=integration ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Migration files
        run: ./scripts/check-migrations.sh
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true
      - name: "Contracts: buf lint and buf format"
        run: buf lint && buf format --diff --exit-code
      - name: "Contracts: no breaking change against main"
        run: |
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            buf breaking --against '.git#ref=origin/main'
          else
            echo "main has no contracts yet: nothing to compare against"
          fi
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: 1.31.1
      - name: "Generated code is current (buf, sqlc)"
        run: |
          buf generate
          sqlc generate
          git status --porcelain -- internal/gen internal/booking/bookingdb | tee /dev/stderr | (! grep -q .) || { echo "run make gen and commit the result"; exit 1; }

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: holdfast
          POSTGRES_PASSWORD: holdfast
          POSTGRES_DB: holdfast
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U holdfast -d holdfast"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      kafka:
        image: apache/kafka:4.3.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 30 --health-start-period 20s
    env:
      HOLDFAST_TEST_VALKEY_ADDR: localhost:6379
      HOLDFAST_TEST_POSTGRES_DSN: postgres://holdfast:holdfast@localhost:5432/holdfast?sslmode=disable
      HOLDFAST_TEST_KAFKA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Integration tests
        run: go test -race -count=1 -tags=integration ./...
      - name: "E1: no oversell under 50,000 concurrent buyers"
        run: >-
          go run ./cmd/contention -mode all
          -valkey "$HOLDFAST_TEST_VALKEY_ADDR" -dsn "$HOLDFAST_TEST_POSTGRES_DSN"
          -json e1-results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e1-results
          path: e1-results.json
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # secret scanning looks at history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: [lint, unit, integration]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [inventory, queue, holdfastctl]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: holdfast/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
