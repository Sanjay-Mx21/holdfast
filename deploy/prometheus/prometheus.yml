global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Alert rules (deploy/alerting, mounted by Compose): design doc 12.2. Only
# *.rules.yml: the folder also holds the rules' tests (tests.yml).
rule_files:
  - /etc/prometheus/rules/*.rules.yml

# Firing alerts go to Alertmanager (task 5.6), which groups them, routes
# them by severity, and holds silences.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: inventory
    static_configs:
      - targets: ["inventory:9090"]

  - job_name: queue
    static_configs:
      - targets: ["queue:9090"]

  - job_name: booking
    static_configs:
      - targets: ["booking:9090"]

  - job_name: payment
    static_configs:
      - targets: ["payment:9090"]

  - job_name: mockpsp
    static_configs:
      - targets: ["mockpsp:9090"]

  - job_name: auth
    static_configs:
      - targets: ["auth:9090"]

  # Saturation of the stores (task 4.6, the mission-control dashboard).
  # Both Valkey nodes (task 5.2), through redis_exporter's multi-target
  # endpoint; `instance` is the node, and redis_instance_info{role} says
  # which one is the primary right now.
  - job_name: valkey
    metrics_path: /scrape
    static_configs:
      - targets: ["redis://valkey:6379", "redis://valkey-replica:6379"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: valkey-exporter:9121

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # The invariant auditor (task 5.1): holdfast_invariant_violations.
  - job_name: auditor
    static_configs:
      - targets: ["auditor:9090"]
