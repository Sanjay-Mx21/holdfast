# HoldFast edge (task 2.9). One front door for buyers: it routes queue and
# inventory paths, micro-caches the two documents every waiting client polls,
# rate-limits the queue per client IP, and tells the services who the client
# is. In production a CDN plays this role; the rules stay the same.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  server_tokens off;

  log_format edge '$remote_addr rid=$request_id "$request" $status $body_bytes_sent '
                  'rt=$request_time cache=$upstream_cache_status';
  access_log /dev/stdout edge;
  error_log /dev/stderr warn;

  # The micro-cache. Entries live one second (the origin says max-age=1);
  # inactive=30s keeps a stale copy around to serve while the origin is
  # updating or down.
  proxy_cache_path /var/cache/nginx/micro keys_zone=micro:10m max_size=64m inactive=30s use_temp_path=off;

  # Edge rate limit for the queue API, per client address. queue-svc applies
  # its own per-IP and per-user token buckets behind this.
  limit_req_zone $binary_remote_addr zone=per_ip:20m rate=10r/s;
  limit_req_status 429;

  upstream queue_svc {
    server queue:8080;
    keepalive 64;
  }

  upstream inventory_svc {
    server inventory:8080;
    keepalive 64;
  }

  # Every proxied request: keep-alive connections to the origins, and the
  # client as this edge saw it. X-Forwarded-For and X-Real-IP are set, never
  # appended to, so a client cannot inject an address; queue-svc trusts them
  # only from this proxy (TRUSTED_PROXIES). The request ID is the edge's own,
  # so its access log and the services' logs share one ID per request.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Request-Id $request_id;

  server {
    listen 80;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # The status document: identical for every client, so one origin fetch
    # per second serves everyone. The key is the path alone, so adding a
    # query string cannot bypass the cache.
    location ~ ^/v1/events/[^/]+/status$ {
      proxy_pass http://queue_svc;
      proxy_cache micro;
      proxy_cache_key $uri;
      proxy_cache_valid 200 1s;
      proxy_cache_lock on;                  # concurrent misses wait for ONE origin fetch
      proxy_cache_lock_timeout 2s;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # Units left: the same treatment, from inventory-svc.
    location ~ ^/v1/events/[^/]+/availability$ {
      proxy_pass http://inventory_svc;
      proxy_cache micro;
      proxy_cache_key $uri;
      proxy_cache_valid 200 1s;
      proxy_cache_lock on;
      proxy_cache_lock_timeout 2s;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # Holds: never cached, carried straight to inventory-svc.
    location ~ ^/v1/events/[^/]+/holds(/|$) {
      proxy_pass http://inventory_svc;
    }

    # The waiting room: join, position, admit.
    location /v1/queue/ {
      limit_req zone=per_ip burst=20 nodelay;
      proxy_pass http://queue_svc;
    }

    location = /.well-known/jwks.json {
      proxy_pass http://queue_svc;
    }

    # Anything else is not part of the public API. (Admin ports are never
    # reachable through the edge.)
    location / {
      default_type application/problem+json;
      return 404 '{"type":"/problems/route-not-found","title":"Not Found","status":404,"code":"ROUTE_NOT_FOUND","detail":"no such endpoint"}';
    }
  }
}
