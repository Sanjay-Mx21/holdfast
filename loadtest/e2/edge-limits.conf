# Experiment E2 only: one load generator stands in for 50,000 clients, so the
# edge's per-client limit is switched off (deploy/nginx/edge-limits.conf is the
# real one). Raising the rate is not enough: NGINX accounts per millisecond, so
# more than burst + 1 requests from one address in the same millisecond are
# refused at any rate. Instead the zone is keyed on a header no client sends,
# and NGINX does not account requests whose key is empty.
limit_req_zone $http_x_holdfast_e2_unused zone=per_ip:1m rate=10r/s;
