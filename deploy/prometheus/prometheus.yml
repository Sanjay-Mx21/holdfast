global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: inventory
    static_configs:
      - targets: ["inventory:9090"]

  - job_name: queue
    static_configs:
      - targets: ["queue:9090"]

  - job_name: booking
    static_configs:
      - targets: ["booking:9090"]

  - job_name: payment
    static_configs:
      - targets: ["payment:9090"]

  - job_name: mockpsp
    static_configs:
      - targets: ["mockpsp:9090"]

  - job_name: auth
    static_configs:
      - targets: ["auth:9090"]

  # Saturation of the stores (task 4.6, the mission-control dashboard).
  - job_name: valkey
    static_configs:
      - targets: ["valkey-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
