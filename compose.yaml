# Local development stack. `make up` generates dev keys first, then runs this.
# Host ports: the edge (NGINX, the buyers' front door) 8088 (EDGE_PORT), inventory API 8081,
# inventory admin 9091, queue API 8082, queue admin 9092, booking API 8083,
# booking admin 9093, inventory gRPC 7071, Prometheus 9090, Alertmanager 9098,
# Grafana 3000, PostgreSQL 5432, Valkey 6379 (the replica 6380), Kafka 29092, Redpanda Console 8089,
# Jaeger 16686, OTLP 4317 (gRPC) and 4318 (HTTP).
# The 808x API ports bypass the edge and are for debugging only.
name: holdfast

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: holdfast
      POSTGRES_PASSWORD: holdfast
      POSTGRES_DB: holdfast
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql # PostgreSQL 18 images keep data under a versioned subdirectory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holdfast -d holdfast"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Valkey with high availability (task 5.2): a primary, a replica and three
  # Sentinels (deploy/valkey/). The services find the primary through the
  # Sentinels (VALKEY_SENTINEL_MASTER=holdfast), so a failover needs no
  # restart. After a failover the replica stays the primary until someone
  # fails back (docs/runbooks/valkey.md). Tools on the host (make itest,
  # make e1) talk to localhost:6379, this node, directly.
  # AOF with fsync every second: a crash loses at most about a second of
  # writes, and a failover what the replica had not received; inventory is
  # rebuilt from PostgreSQL (runbook RB-2).
  #
  # Members know each other, and tell clients, by fixed address on the
  # `valkey` network, never by hostname: Sentinel resolves names in its main
  # loop, and a dead node's name stalls every lookup until the Sentinels
  # enter TILT mode and refuse to fail over (P47). Clients of Valkey join
  # that network.
  valkey:
    image: valkey/valkey:9.1.2
    init: true # PID 1 reaps the healthcheck's processes, not Valkey
    entrypoint: ["sh", "/etc/holdfast/entrypoint.sh"]
    command: ["node", "10.251.0.10"]
    ports: ["6379:6379"]
    networks:
      default:
      valkey: { ipv4_address: 10.251.0.10 }
    volumes:
      - valkey-data:/data
      - ./deploy/valkey:/etc/holdfast:ro
    healthcheck: &valkey-health
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey-replica:
    image: valkey/valkey:9.1.2
    init: true
    entrypoint: ["sh", "/etc/holdfast/entrypoint.sh"]
    command: ["node", "10.251.0.11", "10.251.0.10"] # starts as a replica of valkey
    ports: ["6380:6379"] # for inspection (valkey-cli -p 6380); never written from the host
    networks:
      default:
      valkey: { ipv4_address: 10.251.0.11 }
    volumes:
      - valkey-replica-data:/data
      - ./deploy/valkey:/etc/holdfast:ro
    healthcheck: *valkey-health
    depends_on:
      valkey: { condition: service_healthy }
    restart: unless-stopped

  # Three Sentinels: two must agree the primary is down, and a majority
  # elects the one that promotes the replica. Each keeps what it learns in
  # its own volume.
  sentinel-1: &sentinel
    image: valkey/valkey:9.1.2
    init: true
    entrypoint: ["sh", "/etc/holdfast/entrypoint.sh"]
    command: ["sentinel", "10.251.0.21"]
    networks:
      valkey: { ipv4_address: 10.251.0.21 }
    volumes:
      - sentinel-1-data:/data
      - ./deploy/valkey:/etc/holdfast:ro
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -p 26379 sentinel get-master-addr-by-name holdfast | grep -q ."]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      valkey: { condition: service_healthy }
      valkey-replica: { condition: service_healthy }
    restart: unless-stopped

  sentinel-2:
    <<: *sentinel
    command: ["sentinel", "10.251.0.22"]
    networks:
      valkey: { ipv4_address: 10.251.0.22 }
    volumes:
      - sentinel-2-data:/data
      - ./deploy/valkey:/etc/holdfast:ro

  sentinel-3:
    <<: *sentinel
    command: ["sentinel", "10.251.0.23"]
    networks:
      valkey: { ipv4_address: 10.251.0.23 }
    volumes:
      - sentinel-3-data:/data
      - ./deploy/valkey:/etc/holdfast:ro

  # One-shot job: applies migrations, then exits. Services wait for it.
  # Also usable for ad-hoc operations: docker compose run --rm holdfastctl <command>
  holdfastctl:
    build:
      context: .
      args: { SERVICE: holdfastctl }
    command: ["migrate"]
    networks: [default, valkey]
    environment:
      POSTGRES_DSN: postgres://holdfast:holdfast@postgres:5432/holdfast?sslmode=disable
      VALKEY_ADDRS: 10.251.0.21:26379,10.251.0.22:26379,10.251.0.23:26379 # the Sentinels
      VALKEY_SENTINEL_MASTER: holdfast
    depends_on:
      postgres: { condition: service_healthy }
      sentinel-1: { condition: service_healthy }
      sentinel-2: { condition: service_healthy }
      sentinel-3: { condition: service_healthy }
    restart: "no"

  # Kafka 4.3 in KRaft mode (no ZooKeeper): one node, broker and controller.
  # Auto-creation is off; topics come from the kafka-topics job below.
  kafka:
    image: apache/kafka:4.3.1
    ports: ["29092:29092"] # EXTERNAL listener, for clients on the host
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m # the laptop shares 7.6 GB with everything else
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # One-shot job: creates every topic (idempotent), then exits.
  kafka-topics:
    build:
      context: .
      args: { SERVICE: holdfastctl }
    command: ["kafka", "topics", "--brokers", "kafka:9092"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"

  # A web UI for topics, messages and consumer groups: http://localhost:8089
  # (the design doc's 8088 is the edge's port here).
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    environment:
      KAFKA_BROKERS: kafka:9092
    ports: ["8089:8080"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  # booking-svc: turns holds into bookings that wait for payment. Calls
  # inventory over gRPC with its own service token (dev key from make keys).
  booking:
    build:
      context: .
      args: { SERVICE: booking }
    environment:
      ENVIRONMENT: development
      LOG_FORMAT: text
      ACCESS_JWKS_URL: http://auth:8080/.well-known/jwks.json # buyers sign in with auth-svc
      DEV_IDENTITY: ${DEV_IDENTITY:-false} # true: X-Dev-User-Id also works (development, load tests)
      POSTGRES_DSN: postgres://holdfast:holdfast@postgres:5432/holdfast?sslmode=disable
      INVENTORY_GRPC_ADDR: inventory:7070
      SERVICE_PRIVATE_KEY_FILE: /keys/booking.key
      PAYMENT_GRPC_ADDR: payment:7070
      KAFKA_BROKERS: kafka:9092 # the outbox relay publishes booking events
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks: [default, edge]
    ports:
      - "8083:8080" # public API
      - "9093:9090" # admin: metrics, health, pprof (never expose in production)
    volumes:
      - ./.local/keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      holdfastctl: { condition: service_completed_successfully }
      kafka-topics: { condition: service_completed_successfully }
      inventory: { condition: service_started }
      payment: { condition: service_started }
      auth: { condition: service_started }
    restart: unless-stopped

  # auth-svc: sign-in with a code sent to a phone (a mock SMS gateway whose
  # inbox is readable in development), access tokens and their JWKS.
  auth:
    build:
      context: .
      args: { SERVICE: auth }
    environment:
      ENVIRONMENT: development
      LOG_FORMAT: text
      POSTGRES_DSN: postgres://holdfast:holdfast@postgres:5432/holdfast?sslmode=disable
      SIGNING_KEY_FILE: /keys/auth.key
      PHONE_PEPPER: ${PHONE_PEPPER:-dev-only-phone-pepper-change-me-in-any-real-deployment}
      DEV_SMS_INBOX: "true" # GET /v1/auth/dev/inbox shows the code; never in production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks: [default, edge]
    ports:
      - "8086:8080" # public API (the edge routes /v1/auth/ here)
      - "9096:9090" # admin: metrics, health, pprof (never expose in production)
    volumes:
      - ./.local/keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      holdfastctl: { condition: service_completed_successfully }
    restart: unless-stopped

  # payment-svc: intents over gRPC for booking-svc, the provider's webhooks,
  # the ledger. The provider is mockpsp.
  payment:
    build:
      context: .
      args: { SERVICE: payment }
    environment:
      ENVIRONMENT: development
      LOG_FORMAT: text
      POSTGRES_DSN: postgres://holdfast:holdfast@postgres:5432/holdfast?sslmode=disable
      GRPC_TRUSTED_CALLERS: booking=/keys/booking.pub,queue=/keys/queue.pub # queue-svc reads the provider's pressure
      PSP_BASE_URL: http://mockpsp:8080
      PSP_API_KEY: ${PSP_API_KEY:-dev-only-psp-api-key}
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:-dev-only-webhook-secret-change-me-in-any-real-deployment}
      KAFKA_BROKERS: kafka:9092 # the outbox relay publishes payment events
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8084:8080" # public: POST /v1/webhooks/psp
      - "9094:9090" # admin: metrics, health, pprof (never expose in production)
      - "7072:7070" # gRPC, for grpcurl while developing
    volumes:
      - ./.local/keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      holdfastctl: { condition: service_completed_successfully }
      kafka-topics: { condition: service_completed_successfully }
      mockpsp: { condition: service_started }
    restart: unless-stopped

  # mockpsp: the stand-in payment provider, with a checkout page for
  # browsers (http://localhost:8085/checkout/...) and fault injection on its
  # admin port. A test tool: never expose it.
  mockpsp:
    build:
      context: .
      args: { SERVICE: mockpsp }
    environment:
      ENVIRONMENT: development
      LOG_FORMAT: text
      PUBLIC_URL: http://localhost:8085
      API_KEY: ${PSP_API_KEY:-dev-only-psp-api-key}
      WEBHOOK_URL: http://payment:8080/v1/webhooks/psp
      WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:-dev-only-webhook-secret-change-me-in-any-real-deployment}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-only-admin-token-change-me-0123456789}
    ports:
      - "8085:8080" # provider API and checkout page
      - "9095:9090" # admin: faults, reset, stats, metrics (never expose)
    restart: unless-stopped

  # Traces: services send OTLP to the collector, which forwards to Jaeger.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    volumes: ["./deploy/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"] # OTLP gRPC and HTTP, for services run on the host
    depends_on: [jaeger]
    restart: unless-stopped

  # Jaeger UI: http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686"]
    restart: unless-stopped

  inventory:
    build:
      context: .
      args: { SERVICE: inventory }
    environment:
      ENVIRONMENT: development
      LOG_FORMAT: text
      VALKEY_ADDRS: 10.251.0.21:26379,10.251.0.22:26379,10.251.0.23:26379 # the Sentinels
      VALKEY_SENTINEL_MASTER: holdfast
      # Trust whatever queue-svc publishes: key rotation needs no restart here.
      ADMISSION_JWKS_URL: http://queue:8080/.well-known/jwks.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Internal gRPC API: booking-svc's and queue-svc's service tokens are trusted (dev keys from make keys).
      GRPC_TRUSTED_CALLERS: booking=/keys/booking.pub,queue=/keys/queue.pub
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-only-admin-token-change-me-0123456789}
    networks: [default, edge, valkey]
    ports:
      - "8081:8080" # public API
      - "9091:9090" # admin: metrics, health, pprof, operator API (never expose in production)
      - "7071:7070" # internal gRPC API, for services run on the host (never expose in production)
    volumes:
      - ./.local/keys:/keys:ro
    depends_on:
      sentinel-1: { condition: service_healthy }
      sentinel-2: { condition: service_healthy }
      sentinel-3: { condition: service_healthy }
      holdfastctl: { condition: service_completed_successfully }
      queue: { condition: service_started }
    restart: unless-stopped

  queue:
    build:
      context: .
      args: { SERVICE: queue }
    environment:
      ENVIRONMENT: development
      LOG_FORMAT: text
      VALKEY_ADDRS: 10.251.0.21:26379,10.251.0.22:26379,10.251.0.23:26379 # the Sentinels
      VALKEY_SENTINEL_MASTER: holdfast
      ACCESS_JWKS_URL: http://auth:8080/.well-known/jwks.json # buyers sign in with auth-svc
      DEV_IDENTITY: ${DEV_IDENTITY:-false} # true: X-Dev-User-Id also works (development, load tests)
      POSTGRES_DSN: postgres://holdfast:holdfast@postgres:5432/holdfast?sslmode=disable # admission leader election
      ADMISSION_PRIVATE_KEY_FILE: /keys/admission.key # signs admission tokens (dev key from make keys)
      TRUSTED_PROXIES: 10.250.0.10/32 # only the edge's X-Forwarded-For is believed
      # Admission leaders read inventory's units left over gRPC (P17): open
      # sessions stay within units left x 1.3, and a sold-out queue says so.
      INVENTORY_GRPC_ADDR: inventory:7070
      SERVICE_PRIVATE_KEY_FILE: /keys/queue.key
      # Adaptive admission (task 5.4): each leader's rate follows the payment
      # provider's pressure, and pauses while its circuit breaker is open.
      PAYMENT_GRPC_ADDR: payment:7070
      # Joins need a solved proof-of-work challenge (GET .../challenge);
      # POW_DIFFICULTY=0 make up turns it off.
      POW_DIFFICULTY: ${POW_DIFFICULTY:-18}
      POW_SECRET: ${POW_SECRET:-dev-only-pow-secret-change-me-0123456789}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-only-admin-token-change-me-0123456789}
    networks: [default, edge, valkey]
    ports:
      - "8082:8080" # public API
      - "9092:9090" # admin: metrics, health, pprof, operator API (never expose in production)
    volumes:
      - ./.local/keys:/keys:ro
    depends_on:
      sentinel-1: { condition: service_healthy }
      sentinel-2: { condition: service_healthy }
      sentinel-3: { condition: service_healthy }
      postgres: { condition: service_healthy }
      auth: { condition: service_started }
    restart: unless-stopped

  # The web app (task 4.5): a static export served by nginx, behind the edge.
  # NEXT_PUBLIC_DEV_INBOX=1 adds a button that reads sign-in codes from
  # auth-svc's development inbox.
  web:
    build:
      context: ./web
      args: { NEXT_PUBLIC_DEV_INBOX: "1" }
    networks: [edge]
    restart: unless-stopped

  # The edge: routes, micro-caches the status and availability documents for
  # one second, rate-limits the queue per client, and passes the client's
  # address to the services. It has a fixed address on the edge network so
  # queue-svc can trust exactly it (TRUSTED_PROXIES).
  nginx:
    image: nginx:1.30.5-alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/edge-limits.conf:/etc/nginx/edge-limits.conf:ro
    networks:
      edge: { ipv4_address: 10.250.0.10 }
    ports:
      - "${EDGE_PORT:-8088}:80"
    depends_on: [queue, inventory, booking, auth, web]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The invariant auditor (task 5.1): checks I1 to I5 from PostgreSQL (with
  # read-only connections) and inventory's Valkey keys, and publishes
  # holdfast_invariant_violations. Admin port only.
  auditor:
    build:
      context: .
      args: { SERVICE: auditor }
    environment:
      ENVIRONMENT: development
      LOG_FORMAT: text
      POSTGRES_DSN: postgres://holdfast:holdfast@postgres:5432/holdfast?sslmode=disable
      VALKEY_ADDRS: 10.251.0.21:26379,10.251.0.22:26379,10.251.0.23:26379 # the Sentinels
      VALKEY_SENTINEL_MASTER: holdfast
    networks: [default, valkey]
    ports:
      - "9097:9090" # admin: metrics, health, pprof (never expose in production)
    depends_on:
      postgres: { condition: service_healthy }
      sentinel-1: { condition: service_healthy }
      sentinel-2: { condition: service_healthy }
      sentinel-3: { condition: service_healthy }
      holdfastctl: { condition: service_completed_successfully }
    restart: unless-stopped

  # Exporters for the mission-control dashboard's health row (task 4.6):
  # Valkey's CPU and command rate, PostgreSQL's transactions and connections.
  # Prometheus scrapes both Valkey nodes through it (/scrape?target=...).
  valkey-exporter:
    image: oliver006/redis_exporter:v1.93.0 # speaks Valkey's protocol
    environment:
      REDIS_ADDR: redis://valkey:6379
    depends_on:
      valkey: { condition: service_healthy }
      valkey-replica: { condition: service_healthy }
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://holdfast:holdfast@postgres:5432/holdfast?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerting:/etc/prometheus/rules:ro
    ports: ["9090:9090"]
    depends_on: [inventory, queue, alertmanager]
    restart: unless-stopped

  # Groups Prometheus's alerts, routes them by severity, holds silences
  # (task 5.6; deploy/alertmanager). Locally it sends nothing anywhere.
  alertmanager:
    image: prom/alertmanager:v0.30.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager:ro
    ports: ["9098:9093"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin # local development only
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

networks:
  # Edge to services. Its own subnet, so the edge's address is fixed and
  # nothing else on it (the Docker gateway, other containers) can pose as it.
  edge:
    ipam:
      config:
        - subnet: 10.250.0.0/24
  # Valkey's nodes and Sentinels at fixed addresses (task 5.2), and their clients.
  valkey:
    ipam:
      config:
        - subnet: 10.251.0.0/24

volumes:
  postgres-data:
  valkey-data:
  valkey-replica-data:
  sentinel-1-data:
  sentinel-2-data:
  sentinel-3-data:
  kafka-data:
