# Serves the web app's static export (next build, output: 'export'). The
# edge (deploy/nginx) sits in front and caches what this server allows: the
# pages for a minute, the hashed assets for a year.

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;

  # Pages are static: the event, the waiting room and the booking are the
  # same HTML for everyone, and read their IDs from the query string. So one
  # cached copy serves every buyer and every event.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
    add_header Cache-Control "public, max-age=60" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # Next.js bootstraps the page with inline scripts, so scripts and styles
    # allow 'unsafe-inline'; everything else is this origin only. The
    # proof-of-work solver runs in a worker from this origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  }

  # Hashed build assets never change under the same name.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  error_page 404 /404.html;
}
