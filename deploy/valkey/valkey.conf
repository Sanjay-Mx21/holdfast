# A HoldFast Valkey node (task 5.2). entrypoint.sh copies this into the
# node's volume on its first start and adds its announced name (and, on the
# replica, replicaof). From then on the copy is the node's configuration:
# Sentinel rewrites it when it promotes or demotes the node.
bind * -::*
protected-mode no
port 6379
dir /data

# AOF with fsync every second: a crash loses at most about a second of
# writes. Replication is asynchronous, so a failover can also lose what the
# replica had not yet received. PostgreSQL's final guard keeps I1 either
# way, and runbook RB-2 rebuilds inventory from PostgreSQL.
appendonly yes
appendfsync everysec

# Inventory and the queue must never be evicted to make room.
maxmemory-policy noeviction
